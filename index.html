<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Area of a Trapezium · a lesson with Swiftee</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23159289'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/world.css">
<link rel="stylesheet" href="styles/lesson.css">
</head>
<body>

<!-- ============ THE WORLD ============ -->
<div id="world" aria-hidden="true">
  <div class="w-layer" id="w-sky"></div>
  <div class="w-layer" id="w-mid"></div>
  <div class="w-layer" id="w-ground"></div>
  <div class="w-fx" id="w-stars"></div>
  <div class="w-fx" id="w-dust"></div>
  <div class="w-fx" id="w-haze"></div>
  <div class="w-fx" id="w-sweep"></div>
</div>

<!-- ============ THE LESSON ============ -->
<div id="app">
  <div id="stage">

    <button class="icon-btn" id="sound" title="Sound on / off" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7 1 1 0 0 0 1.4 1.4 7 7 0 0 0 0-9.8 1 1 0 0 0-1.4 1.4z"/></svg>
    </button>

    <header id="lesson-head">
      <h1 id="lesson-title"></h1>
      <p  id="lesson-sub"></p>
    </header>

    <!-- the learning surface: a panel placed into the world -->
    <div id="card">
      <div class="stage-floor" aria-hidden="true"></div>
      <svg id="board" class="layer" viewBox="0 0 1280 720" aria-hidden="true">
        <defs>
          <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
      <div id="ui-layer" class="layer"></div>

      <!-- Swiftee speaks here. One caption on the panel's apron, so what
           the character says can never sit on top of what it is about. -->
      <p id="caption" aria-live="polite"></p>
      <div id="fx-layer" class="layer"></div>
      <button id="back" class="btn ghost small" type="button">Back</button>
      <div id="progress"><i></i></div>
    </div>

    <!-- Swiftee shares the card's coordinates but is never clipped by it,
         so it can step out onto the Mars ground -->
    <div id="swiftee-space"><div id="swiftee-layer"></div></div>

  </div>
</div>

<script src="src/core/util.js"></script>
<script src="src/core/anim.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/components/world.js"></script>
<script src="src/components/geometry.js"></script>
<script src="src/components/swiftee.data.js"></script>
<script src="src/components/swiftee.js"></script>
<script src="src/components/ui.js"></script>
<script src="src/core/lesson.js"></script>
<script src="src/stages/act1.js"></script>
<script src="src/stages/act2.js"></script>
<script src="src/stages/act3.js"></script>
<script src="src/main.js"></script>
</body>
</html>
